# Prometheus Alert Rules per 17_observability.md §8
groups:
  - name: ingestion_connector_alerts
    rules:
      # [GATE]: Poll-fallback liveness heartbeat stale -> Critical
      # Traces to 12_gmail_connector.md §17 and 17_observability.md §8 (H2 safety-net failure)
      - alert: PollFallbackLivenessStale
        expr: (time() - ingestion_poll_fallback_liveness) > 1800
        for: 5m
        labels:
          severity: critical
          module: ingestion
        annotations:
          summary: "Gmail poll-fallback safety net has stopped reporting liveness heartbeats"
          description: "The scheduled poll-fallback task has not reported a heartbeat for over 30 minutes (2x the 15-minute expected cycle). Dual-trigger H2 protection is degraded."
          runbook_url: "docs/12_gmail_connector.md#17-production-considerations"

      # Watch renewal failure -> Medium severity
      - alert: GmailWatchRenewalFailing
        expr: rate(ingestion_watch_renewal_failure_total[1h]) > 0 and rate(ingestion_watch_renewal_success_total[1h]) == 0
        for: 15m
        labels:
          severity: medium
          module: ingestion
        annotations:
          summary: "Gmail watch renewals are failing continuously"
          description: "Watch renewals are failing without any successful renewals in the last hour. Affected mailboxes may fall back to poll-only mode."

      # Watch expiring soon -> Medium severity warning if accounts within 24h of expiry
      - alert: GmailWatchesExpiringSoon
        expr: ingestion_watch_expiring_soon > 0
        for: 2h
        labels:
          severity: medium
          module: ingestion
        annotations:
          summary: "One or more Gmail accounts are within 24 hours of watch expiration"
          description: "Active Gmail accounts have watch leases expiring within 24 hours and have not yet been renewed."

      # History sync fallback spike -> High severity
      - alert: HistorySyncFallbackSpike
        expr: rate(ingestion_history_sync_fallback_total[1h]) > 0.05
        for: 10m
        labels:
          severity: high
          module: ingestion
        annotations:
          summary: "Spike in Gmail historyId expirations triggering bounded fallback"
          description: "Abnormal rate of 404 historyId expirations detected. Verify push webhook health and poll frequency."

  - name: understanding_parser_alerts
    rules:
      # [GATE]: Parser failure rate > 5% trailing 1h -> Critical alert
      # Traces to 13_email_parser.md §8.2 and 17_observability.md §8 (Hotspot H3 early warning)
      - alert: ParserTemplateFailureRateSpike
        expr: understanding_template_failure_rate{window="1h"} > 0.05
        for: 5m
        labels:
          severity: critical
          module: understanding
        annotations:
          summary: "Deterministic parser template failure rate exceeded 5% threshold"
          description: "Template for sender {{ $labels.sender_pattern }} has a failure rate of {{ $value | humanizePercentage }} over trailing 1h. Email format may have changed, triggering costly AI fallback."
          runbook_url: "docs/13_email_parser.md#82-spike-detection--alerting"

      # [GATE]: AI queue backpressure (depth or oldest-task-age threshold)
      # Traces to 06_architecture.md §6.5 (Hotspot H3) and 17_observability.md §8
      - alert: AIQueueBackpressure
        expr: understanding_ai_queue_depth{queue_name="understanding:ai"} > 100 or understanding_ai_oldest_task_age_seconds{queue_name="understanding:ai"} > 300
        for: 2m
        labels:
          severity: high
          module: understanding
        annotations:
          summary: "AI extraction fallback queue backpressure detected (H3 resolution)"
          description: "Queue understanding:ai depth is {{ $value }} or oldest pending task exceeds 5m threshold. Correlate with parser failure rate spike."
          runbook_url: "docs/06_architecture.md#65-resolving-hotspot-h3-ai-extraction-fallback-storm"
