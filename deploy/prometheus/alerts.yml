# Prometheus Alert Rules per 17_observability.md §8
groups:
  - name: ingestion_connector_alerts
    rules:
      # [GATE]: Poll-fallback liveness heartbeat stale -> Critical
      # Traces to 12_gmail_connector.md §17 and 17_observability.md §8 (H2 safety-net failure)
      - alert: PollFallbackLivenessStale
        expr: (time() - ingestion_poll_fallback_liveness) > 1800
        for: 5m
        labels:
          severity: critical
          module: ingestion
        annotations:
          summary: "Gmail poll-fallback safety net has stopped reporting liveness heartbeats"
          description: "The scheduled poll-fallback task has not reported a heartbeat for over 30 minutes (2x the 15-minute expected cycle). Dual-trigger H2 protection is degraded."
          runbook_url: "docs/12_gmail_connector.md#17-production-considerations"

      # Watch renewal failure -> Medium severity
      - alert: GmailWatchRenewalFailing
        expr: rate(ingestion_watch_renewal_failure_total[1h]) > 0 and rate(ingestion_watch_renewal_success_total[1h]) == 0
        for: 15m
        labels:
          severity: medium
          module: ingestion
        annotations:
          summary: "Gmail watch renewals are failing continuously"
          description: "Watch renewals are failing without any successful renewals in the last hour. Affected mailboxes may fall back to poll-only mode."

      # Watch expiring soon -> Medium severity warning if accounts within 24h of expiry
      - alert: GmailWatchesExpiringSoon
        expr: ingestion_watch_expiring_soon > 0
        for: 2h
        labels:
          severity: medium
          module: ingestion
        annotations:
          summary: "One or more Gmail accounts are within 24 hours of watch expiration"
          description: "Active Gmail accounts have watch leases expiring within 24 hours and have not yet been renewed."

      # History sync fallback spike -> High severity
      - alert: HistorySyncFallbackSpike
        expr: rate(ingestion_history_sync_fallback_total[1h]) > 0.05
        for: 10m
        labels:
          severity: high
          module: ingestion
        annotations:
          summary: "Spike in Gmail historyId expirations triggering bounded fallback"
          description: "Abnormal rate of 404 historyId expirations detected. Verify push webhook health and poll frequency."

  - name: understanding_parser_alerts
    rules:
      # [GATE]: Parser failure rate > 5% trailing 1h -> Critical alert
      # Traces to 13_email_parser.md §8.2 and 17_observability.md §8 (Hotspot H3 early warning)
      - alert: ParserTemplateFailureRateSpike
        expr: understanding_template_failure_rate{window="1h"} > 0.05
        for: 5m
        labels:
          severity: critical
          module: understanding
        annotations:
          summary: "Deterministic parser template failure rate exceeded 5% threshold"
          description: "Template for sender {{ $labels.sender_pattern }} has a failure rate of {{ $value | humanizePercentage }} over trailing 1h. Email format may have changed, triggering costly AI fallback."
          runbook_url: "docs/13_email_parser.md#82-spike-detection--alerting"

      # [GATE]: AI queue backpressure (depth or oldest-task-age threshold)
      # Traces to 06_architecture.md §6.5 (Hotspot H3) and 17_observability.md §8
      - alert: AIQueueBackpressure
        expr: understanding_ai_queue_depth{queue_name="understanding:ai"} > 100 or understanding_ai_oldest_task_age_seconds{queue_name="understanding:ai"} > 300
        for: 2m
        labels:
          severity: high
          module: understanding
        annotations:
          summary: "AI extraction fallback queue backpressure detected (H3 resolution)"
          description: "Queue understanding:ai depth is {{ $value }} or oldest pending task exceeds 5m threshold. Correlate with parser failure rate spike."
          runbook_url: "docs/06_architecture.md#65-resolving-hotspot-h3-ai-extraction-fallback-storm"

  - name: financialcore_alerts
    rules:
      # Pending-review SLA breach (7-day default) per 17_observability.md §8 & sprint checklist
      - alert: FinancialCorePendingReviewSLABreach
        expr: increase(financialcore_pending_review_sla_breach_total[1h]) > 0
        for: 1m
        labels:
          severity: medium
          module: financialcore
        annotations:
          summary: "FinancialCore pending-review SLA breach detected"
          description: "One or more transactions have remained in pending_review status beyond the SLA window (7-day default) without user confirmation."
          runbook_url: "docs/17_observability.md#8-alerting-rules--severity"

  - name: platform_and_infrastructure_alerts
    rules:
      # Outbox relay lag exceeds SLO (17_observability.md §8 & §9)
      - alert: OutboxRelayLagExceeded
        expr: histogram_quantile(0.95, sum(rate(outbox_relay_lag_seconds_bucket[5m])) by (le, module)) > 30
        for: 5m
        labels:
          severity: medium
          module: platform
        annotations:
          summary: "Outbox relay lag P95 exceeded 30 seconds"
          description: "Outbox relay in module {{ $labels.module }} has a P95 lag of {{ $value }}s, indicating async broker or poller delay."
          runbook_url: "docs/17_observability.md#8-alerting-rules--severity"

      # Dead-letter queue growth (17_observability.md §8)
      - alert: DeadLetterQueueGrowth
        expr: increase(asynq_dead_letter_total[15m]) > 5
        for: 5m
        labels:
          severity: medium
          module: platform
        annotations:
          summary: "Asynq dead-letter queue is accumulating exhausted tasks"
          description: "{{ $value }} tasks have failed all retries and moved to dead-letter in queue {{ $labels.queue }}."
          runbook_url: "docs/17_observability.md#8-alerting-rules--severity"

  - name: engagement_alerts
    rules:
      # WhatsApp block-rate rise (17_observability.md §8, 15_notification_system.md §9)
      - alert: WhatsAppBlockRateRise
        expr: engagement_whatsapp_block_rate > 0.02
        for: 15m
        labels:
          severity: high
          module: engagement
        annotations:
          summary: "WhatsApp user block rate exceeds 2% threshold"
          description: "Current block rate is {{ $value | humanizePercentage }}. Immediate risk to Meta WhatsApp Business API quality tier."
          runbook_url: "docs/15_notification_system.md#9-risk-management--mitigation"

  - name: security_and_compliance_alerts
    rules:
      # KMS operation failure -> Critical PagerDuty (16_security.md §19, 17_observability.md §8)
      - alert: KMSOperationFailure
        expr: increase(kms_operation_failure_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          module: security
        annotations:
          summary: "KMS envelope encryption or key unwrapping operation failure"
          description: "KMS operation {{ $labels.operation }} failed for key {{ $labels.key_id }}. Token decryption and refresh operations are failing."
          runbook_url: "docs/19_deployment.md#8-operational-runbooks-incident-response"

      # GDPR erasure approaching deadline -> Critical + Compliance contact (16_security.md §19, 17_observability.md §8)
      - alert: GDPRErasureApproachingDeadline
        expr: gdpr_purge_request_age_days > 25
        for: 1h
        labels:
          severity: critical
          module: compliance
        annotations:
          summary: "GDPR user data erasure request approaching 30-day regulatory deadline"
          description: "One or more purge requests have been active for > 25 days without permanent erasure completion."
          runbook_url: "docs/16_security.md#92-right-to-erasure"

