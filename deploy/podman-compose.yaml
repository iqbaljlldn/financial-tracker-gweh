# Podman / Docker Compose local development environment
# Specified per 06_architecture.md §11, 19_deployment.md §4.3, and 21_project_structure.md §3

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financial_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financial_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financial-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.1
    container_name: financial-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entryPoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-8082}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8083}:8080" # Traefik dashboard
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
    depends_on:
      - platform-api

  platform-api:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    container_name: financial-platform-api
    restart: unless-stopped
    command: ["--mode=api"]
    environment:
      PLATFORM_MODE: "api"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-financial_tracker}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  platform-worker:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    container_name: financial-platform-worker
    restart: unless-stopped
    command: ["--mode=worker"]
    environment:
      PLATFORM_MODE: "worker"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-financial_tracker}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # n8n Operational Workflow Engine per 14_workflow_engine.md §5
  # Isolated network policy: strictly NO access to Postgres or Redis. Only calls platform-api via HTTP.
  n8n:
    image: n8nio/n8n:1.45.0
    container_name: financial-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-ops_admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-ops_changeme123}
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - ops_network

networks:
  default:
  ops_network:
    internal: false # connects n8n to outbound alert sinks and platform-api HTTP ingress only

volumes:
  postgres_data:
  redis_data:
  n8n_data:
