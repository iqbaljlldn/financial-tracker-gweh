# Production environment configuration
# Non-secret structural configuration per 06_architecture.md §9 and 21_project_structure.md §7

platform:
  env: "production"
  http:
    port: 8080
    read_timeout: "15s"
    write_timeout: "15s"
  observability:
    log_level: "info"
    enable_tracing: true
    metrics_port: 9090
  taskserver:
    concurrency: 50

identity:
  token_refresh_window: "5m"
  session_ttl: "24h"

ingestion:
  poll_fallback_interval: "15m"
  batch_size: 200
  max_retries: 5

understanding:
  provider: "groq"
  model: "qwen/qwen3.8-27b"
  confidence_threshold: 0.85
  ai_rate_limit_per_second: 20
  ai_request_timeout: "30s"
  max_ai_fallbacks_per_hour: 10000
  max_daily_quota_per_user: 200

financialcore:
  base_currency: "USD"
  confidence_gate_threshold: 0.85
  auto_finalize: true

budget:
  alert_evaluation_interval: "1m"
  default_warning_threshold: 0.80

analytics:
  projection_batch_size: 500
  projection_lag_alert_threshold: "10s"

engagement:
  notification_batch_size: 100
  delivery_timeout: "5s"
  max_delivery_retries: 5

administration:
  audit_log_retention_days: 0
  metrics_scrape_interval: "15s"
