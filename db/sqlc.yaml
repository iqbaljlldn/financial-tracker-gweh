# Root sqlc configuration per 21_project_structure.md §3 & §10
# Configures per-module schema and query path isolation.
# Cross-schema queries are strictly forbidden per 06_architecture.md §4.

version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/identity"
    queries: "../internal/identity/adapter/postgres/queries"
    gen:
      go:
        package: "gen"
        out: "../internal/identity/adapter/postgres/gen"
        sql_package: "pgx/v5"

  - engine: "postgresql"
    schema: "migrations/ingestion"
